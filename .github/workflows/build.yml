
name: Build HardTycoons

on:
  workflow_dispatch:
  push:
    paths:
      - 'HardTycoons-1.0.0-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract source
        run: unzip HardTycoons-1.0.0-source.zip -d project

      - name: Compile mod
        working-directory: project/HardTycoons-1.0.0
        run: gradle build

      - name: Save JAR
        uses: actions/upload-artifact@v4
        with:
          name: HardTycoons-1.0.0
          path: project/HardTycoons-1.0.0/build/libs/hardtycoons-1.0.0.jar
          
